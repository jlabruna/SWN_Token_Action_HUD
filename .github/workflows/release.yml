name: Release

on:
  release:
    # GitHub does not dispatch the "created" event for a draft when it is
    # later published. Publishing is the point at which release assets must
    # be built and attached.
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate and test
        run: |
          npm run check
          npm test

      - name: Verify tag and manifest versions
        run: test "${{ github.event.release.tag_name }}" = "v$(node -p "require('./module.json').version")"

      - name: Create zip
        run: |
          zip -r token-action-hud-swnr-v14.zip \
            module.json \
            scripts/ \
            styles/ \
            lang/ \
            README.md \
            CHANGELOG.md \
            LICENSE

      - name: Upload release assets
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            module.json \
            token-action-hud-swnr-v14.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
